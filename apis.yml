name: OriGene Technologies
description: OriGene Technologies, Inc. is a life sciences company that develops and
  supplies validated research reagents and laboratory services for genomics and proteomics
  research. Its catalog spans cDNA clones, expression vectors, lentivirus and viral
  gene-delivery systems, RNAi and CRISPR tools, primary antibodies, recombinant proteins,
  ELISA and assay kits, and human tissue samples, alongside custom cloning, antibody
  and protein development, and lentivirus production services. The company operates
  in the United States and, through OriGene Technologies GmbH, in Europe. It was surfaced
  as a portfolio company of Qiming and profiled in the API Evangelist network; as of
  this enrichment pass OriGene publishes no public developer API, SDK, or developer
  portal.
